name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Compilar e rodar testes
        run: ./gradlew assembleDebug testDebugUnitTest